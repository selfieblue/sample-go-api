{{- if .Values.configEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample-go-api.fullname" . }}-config
  labels:
    {{- include "sample-go-api.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: "{{ $value }}"
{{- end }}
{{- end }}
