replicaCount: 1

image:
  repository: sample-go-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

env:
  port: "8080"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Additional labels applied to chart resources (Deployment, Service, etc.)
labels: {}

# Additional labels applied specifically to the pod template.
podLabels: {}

# Toggle creation of a ConfigMap that is injected into the pod as environment variables.
configEnabled: true

# Key/value pairs written to the ConfigMap when configEnabled is true.
config:
  ENV: poc
  DB_ENDPOINT: db1.private.example.com
  REDIS_ENDPOINT: redis1.private.example.com

# Istio exposure (Gateway + VirtualService). Disabled by default.
istio:
  enabled: true

  gateway:
    name: ""          # defaults to "<release>-<chart>-gateway" when empty
    namespace: ""     # optional override; defaults to release namespace
    selector:
      istio: aks-istio-ingressgateway-internal
    servers:
      - port:
          number: 80
          name: http
          protocol: HTTP
        hosts:
          - "sample-go-api.agent-poc.internal"

  virtualService:
    hosts:
      - "sample-go-api.agent-poc.internal"
    gateways: []      # defaults to gateway above
    http:
      - match:
          - uri:
              prefix: /
        route:
          - destination:
              host: ""  # defaults to service name
              port:
                number: 8080
